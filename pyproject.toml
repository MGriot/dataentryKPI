[project]
name = "dataentrykpi"
version = "2.1.0"
description = "KPI definitions, annual targets and automatic day/week/month/quarter repartition across plants, with a React UI, REST API and MCP server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn==0.51.0",
    "python-multipart==0.0.32",
    "mcp==2.3.0",
    "pandas==2.3.1",
    "numpy==2.3.2",
    "openpyxl==3.1.5",
    "scikit-learn==1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
