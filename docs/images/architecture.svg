<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 1000 660"><title>Data Entry KPI Target Manager architecture</title><desc>Browsers reach the React app through nginx, which proxies /api to the FastAPI REST API. Scripts call the REST API directly. AI agents use the MCP server over stdio or Streamable HTTP with an API key. The REST API and MCP server share one Python core, which stores everything in SQLite files through one connection layer.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M0,0 L10,5 L0,10 z"/></marker><style>.h,.title{fill:#0f172a}.title{font-size:20px;font-weight:700}.h{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.hb{font-size:13.5px;font-weight:600;fill:#0f172a}.xs{font-size:11.5px;fill:#334155}.tag{font-size:11px;font-weight:600;letter-spacing:.06em;fill:#64748b}.edge{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.label{font-size:11.5px;fill:#475569}</style></defs><rect width="1000" height="660" fill="#fff" rx="12"/><text x="40" y="40" class="title">Data Entry KPI Target Manager — architecture</text><text x="40" y="74" class="tag">CLIENTS</text><rect width="280" height="56" x="40" y="84" fill="#eef2ff" stroke="#6366f1" rx="8"/><text x="180" y="107" class="h" text-anchor="middle">Web browser</text><text x="180" y="127" class="s" text-anchor="middle">React app (frontend/)</text><rect width="280" height="56" x="360" y="84" fill="#eef2ff" stroke="#6366f1" rx="8"/><text x="500" y="107" class="h" text-anchor="middle">Scripts &amp; BI tools</text><text x="500" y="127" class="s" text-anchor="middle">HTTP + session token</text><rect width="280" height="56" x="680" y="84" fill="#eef2ff" stroke="#6366f1" rx="8"/><text x="820" y="107" class="h" text-anchor="middle">AI agents</text><text x="820" y="127" class="s" text-anchor="middle">Claude Desktop / Code, any MCP client</text><text x="40" y="186" class="tag">ENTRY POINTS</text><rect width="280" height="78" x="40" y="196" fill="#ecfeff" stroke="#0891b2" rx="8"/><text x="180" y="220" class="h" text-anchor="middle">frontend container (nginx)</text><text x="180" y="240" class="s" text-anchor="middle">serves the built app, proxies /api</text><text x="180" y="259" class="s" text-anchor="middle">CSP + security headers · :3000</text><rect width="280" height="78" x="360" y="196" fill="#ecfeff" stroke="#0891b2" rx="8"/><text x="500" y="220" class="h" text-anchor="middle">REST API — src/api.py</text><text x="500" y="240" class="s" text-anchor="middle">FastAPI · password login · admin role</text><text x="500" y="259" class="s" text-anchor="middle">:8000 · Swagger UI at /docs</text><rect width="280" height="78" x="680" y="196" fill="#f5f3ff" stroke="#7c3aed" rx="8"/><text x="820" y="220" class="h" text-anchor="middle">MCP server — src/mcp_server.py</text><text x="820" y="240" class="s" text-anchor="middle">60 tools · stdio or Streamable HTTP</text><text x="820" y="259" class="s" text-anchor="middle">:8001/mcp · per-user API keys</text><path d="M180,140 L180,194" class="edge"/><path d="M320,235 L358,235" class="edge"/><text x="339" y="227" class="label" text-anchor="middle">/api</text><path d="M500,140 L500,194" class="edge"/><path d="M820,140 L820,194" class="edge"/><rect width="920" height="168" x="40" y="320" fill="#f8fafc" stroke="#94a3b8" rx="10"/><text x="60" y="344" class="tag">SHARED PYTHON CORE (src/) — same rules for REST and MCP</text><g><rect width="280" height="56" x="60" y="356" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="74" y="378" class="hb">user_management</text><text x="74" y="398" class="xs">accounts, sessions, API keys, roles (access.py)</text><rect width="280" height="56" x="360" y="356" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="374" y="378" class="hb" style="font-size:12.5px">kpi_management · plants_management</text><text x="374" y="398" class="xs">hierarchy, specs, splits, templates, visibility</text><rect width="280" height="56" x="660" y="356" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="674" y="378" class="hb">target_management</text><text x="674" y="398" class="xs">annual save → formula KPIs → repartition</text><rect width="280" height="56" x="60" y="420" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="74" y="442" class="hb">core/formula.py · node_engine.py</text><text x="74" y="462" class="xs">AST-whitelisted formulas, dependency DAG</text><rect width="280" height="56" x="360" y="420" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="374" y="442" class="hb">services</text><text x="374" y="462" class="xs">actuals &amp; status, audit history, ML predictor</text><rect width="280" height="56" x="660" y="420" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="674" y="442" class="hb">export_manager · import_manager</text><text x="674" y="462" class="xs">CSV exports, ZIP backup and restore</text></g><path d="M500,274 L500,318" class="edge"/><path d="M820,274 L820,318" class="edge"/><rect width="920" height="100" x="40" y="534" fill="#fffbeb" stroke="#d97706" rx="10"/><text x="60" y="558" class="tag">DATA — data_access/db.py: one connection, ATTACHed files, atomic multi-file writes</text><g font-size="11.5" text-anchor="middle"><rect width="102" height="44" x="60" y="572" fill="#fff" stroke="#f59e0b" rx="6"/><text x="111" y="590" class="xs" text-anchor="middle">db_kpis</text><text x="111" y="606" fill="#64748b" class="xs" text-anchor="middle">KPIs, folders</text><rect width="102" height="44" x="172" y="572" fill="#fff" stroke="#f59e0b" rx="6"/><text x="223" y="590" class="xs" text-anchor="middle">db_plants</text><text x="223" y="606" fill="#64748b" class="xs" text-anchor="middle">facilities</text><rect width="102" height="44" x="284" y="572" fill="#fff" stroke="#f59e0b" rx="6"/><text x="335" y="590" class="xs" text-anchor="middle">db_kpi_targets</text><text x="335" y="606" fill="#64748b" class="xs" text-anchor="middle">annual targets</text><rect width="152" height="44" x="396" y="572" fill="#fff" stroke="#f59e0b" rx="6"/><text x="472" y="590" class="xs" text-anchor="middle">db_kpi_days / weeks /</text><text x="472" y="606" class="xs" text-anchor="middle">months / quarters</text><rect width="102" height="44" x="558" y="572" fill="#fff" stroke="#f59e0b" rx="6"/><text x="609" y="590" class="xs" text-anchor="middle">db_kpi_templates</text><text x="609" y="606" fill="#64748b" class="xs" text-anchor="middle">splits, templates</text><rect width="88" height="44" x="670" y="572" fill="#fff" stroke="#f59e0b" rx="6"/><text x="714" y="590" class="xs" text-anchor="middle">db_kpi_actuals</text><text x="714" y="606" fill="#64748b" class="xs" text-anchor="middle">measured</text><rect width="88" height="44" x="768" y="572" fill="#fff" stroke="#f59e0b" rx="6"/><text x="812" y="590" class="xs" text-anchor="middle">db_kpi_history</text><text x="812" y="606" fill="#64748b" class="xs" text-anchor="middle">audit trail</text><rect width="74" height="44" x="866" y="572" fill="#fff" stroke="#f59e0b" rx="6"/><text x="903" y="590" class="xs" text-anchor="middle">db_users</text><text x="903" y="606" fill="#64748b" class="xs" text-anchor="middle">accounts</text></g><path d="M500,488 L500,532" class="edge"/></svg>