server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Inherited by every location below that doesn't set its own add_header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The app calls the API same-origin under /api; forward it to the backend container.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # Overwrite (don't append) so clients can't spoof their address to the rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # the ML predictor can take a while on large datasets
        client_max_body_size 25m;     # a little above the backend's MAX_UPLOAD_MB default (20)
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }
}
